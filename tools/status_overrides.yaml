# Список отменённых и заменённых нормативных документов.
#
# Ключ — код нормы в каноничной форме (как в active_norms.json, поле "code").
# Значение — один из:
#   cancelled                      # просто отменена
#   replaced_by: <код новой нормы> # заменена на другую
#
# Примеры:
#   СП 31-110-2003: cancelled
#   СНиП 2.04.01-85: replaced_by: СП 30.13330.2020
#
# Все нормы, НЕ перечисленные здесь, считаются действующими (status: active).
# После правки этого файла перезапустите list_active.py.

overrides: {}
