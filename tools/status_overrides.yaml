# Authoritative manual mapping layer для нормативной базы Norms.
#
# Это ЕДИНСТВЕННЫЙ источник ручных знаний о статусах норм.
# Никаких bootstrap/seed из других проектов; никакого WebSearch.
# Если нормы нет ни в vault/, ни в этом файле — она честно считается
# "не покрыто базой" (см. tools/intake_missing_norms.py).
#
# После правки этого файла запусти:
#     python3 tools/build_status_index.py
#
# ─── Поля записи ─────────────────────────────────────────────────────────────
#
# Ключ — код нормы в каноничной форме (как в status_index.json → "code").
# Матчинг устойчив к точкам/подчёркиваниям/регистру/лишним пробелам.
#
# Значение — либо сокращение, либо dict со следующими полями:
#   doc_status:       active | replaced | cancelled | unknown
#   edition_status:   current | outdated | unknown   (null = неприменимо)
#   current_version:  str | null    — актуальный документ этого семейства
#   replacement_doc:  str | null    — документ, которым заменён (для replaced)
#   aliases:          list[str]     — дополнительные варианты написания
#   details:          str | null    — комментарий для аналитика
#   source_url:       str | null    — пруф (реестр, официальный акт)
#   last_verified:    str | null    — ISO-дата последней ручной проверки
#
# Сокращения (для обратной совместимости со старым форматом):
#   <code>: cancelled                → doc_status: cancelled
#   <code>: { replaced_by: <new> }   → doc_status: replaced, replacement_doc: <new>
#
# ─── Примеры ────────────────────────────────────────────────────────────────
#
# overrides:
#   "СП 30.13330.2016":
#     doc_status: active
#     edition_status: outdated
#     current_version: "СП 30.13330.2020"
#     aliases:
#       - "СП 30.13330.2016"
#       - "сп 30_13330_2016"
#     details: "В базе хранится актуальная редакция 2020"
#     source_url: null
#     last_verified: "2026-04-17"
#
#   "СНиП 2.04.01-85":
#     doc_status: replaced
#     edition_status: null
#     replacement_doc: "СП 30.13330.2020"
#     aliases:
#       - "СНиП 2.04.01-85*"
#     details: "Старый документ заменён актуальным СП"
#     last_verified: "2026-04-17"
#
#   "ВСН 123-90":
#     doc_status: cancelled
#     edition_status: null
#     current_version: null
#     replacement_doc: null
#     details: "Документ отменён без прямой замены"
#     last_verified: "2026-04-17"
#
# ─── Реальные overrides ──────────────────────────────────────────────────────
overrides:
  # Код встретился в реальных findings, но:
  # - MD-файла в vault нет → paragraph lookup недоступен;
  # - проверка актуального статуса / замены требует offline-источника (реестр
  #   МЧС/Росстандарт/Минстроя) и ручного подтверждения, поэтому doc_status
  #   выставлен как `unknown` осознанно (intentionally authoritative gap),
  #   а не угадан. Human должен обновить эту запись.
  "СП 7.13130.2013":
    doc_status: unknown
    edition_status: unknown
    details: "Код присутствует в реальных findings и встречается как цитата в vault, но MD-файла нет. Статус (active/replaced/cancelled) требует ручной проверки по доверенному offline-источнику перед тем, как его менять."
    last_verified: "2026-04-17"

  "СНиП 3.05.01-85":
    doc_status: unknown
    edition_status: unknown
    details: "Код присутствует в реальных findings и встречается как цитата в vault, но MD-файла нет. Замена на современный СП вероятна, но конкретный replacement_doc без доверенного offline-источника выставлять нельзя. Human должен обновить."
    last_verified: "2026-04-17"

